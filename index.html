<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NZ ATPL Human Factors</title>
<style>
  :root{
    --bg:#f5f5f7;
    --text:#1d1d1f;
    --text-dim:rgba(60,60,67,.62);
    --glass:rgba(255,255,255,.62);
    --glass-strong:rgba(255,255,255,.82);
    --stroke:rgba(255,255,255,.75);
    --inner-stroke:rgba(0,0,0,.06);
    --shadow:0 10px 30px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --option-bg:rgba(255,255,255,.55);
    --option-hover:rgba(255,255,255,.85);
    --green:#34c759;
    --green-soft:rgba(52,199,89,.16);
    --red:#ff3b30;
    --red-soft:rgba(255,59,48,.14);
    --grey:rgba(120,120,128,.28);
    --accent:#0a84ff;
  }
  html[data-theme="dark"]{
    --bg:#000;
    --text:#f5f5f7;
    --text-dim:rgba(235,235,245,.6);
    --glass:rgba(28,28,30,.62);
    --glass-strong:rgba(44,44,46,.85);
    --stroke:rgba(255,255,255,.14);
    --inner-stroke:rgba(255,255,255,.05);
    --shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
    --option-bg:rgba(44,44,46,.6);
    --option-hover:rgba(58,58,60,.75);
    --green:#30d158;
    --green-soft:rgba(48,209,88,.2);
    --red:#ff453a;
    --red-soft:rgba(255,69,58,.18);
    --grey:rgba(120,120,128,.32);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;
    background:var(--bg);color:var(--text);
    transition:background .35s ease,color .35s ease;
    min-height:100vh;overflow-x:hidden;
  }
  /* ambient blobs behind glass */
  body::before,body::after{
    content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.55;
    transition:background .5s ease;
  }
  body::before{width:60vmax;height:60vmax;top:-25vmax;left:-18vmax;background:radial-gradient(circle,#a8c7ff,transparent 65%);}
  body::after{width:55vmax;height:55vmax;bottom:-25vmax;right:-15vmax;background:radial-gradient(circle,#ffd6a8,transparent 65%);}
  html[data-theme="dark"] body::before{background:radial-gradient(circle,#1c3a6e,transparent 65%);opacity:.7}
  html[data-theme="dark"] body::after{background:radial-gradient(circle,#4d2f10,transparent 65%);opacity:.7}

  .app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 20px 40px;}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 18px;border-radius:22px;margin-bottom:18px;
    background:var(--glass);border:1px solid var(--stroke);
    box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  }
  h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .spacer{flex:1}
  .btn{
    appearance:none;border:1px solid var(--stroke);cursor:pointer;font:inherit;font-size:14px;font-weight:600;
    padding:9px 16px;border-radius:999px;color:var(--text);background:var(--glass-strong);
    box-shadow:0 1px 3px rgba(0,0,0,.05);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:transform .12s ease, background .2s ease;user-select:none;
  }
  .btn:hover{background:var(--option-hover)}
  .btn:active{transform:scale(.96)}
  .btn.ghost-danger{color:var(--red)}
  .theme-toggle{
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;padding:0;
  }

  /* ---------- layout ---------- */
  .layout{display:flex;gap:18px;align-items:flex-start}
  .card{
    background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--shadow);
    backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
    border-radius:26px;
  }
  .q-panel{flex:1;min-width:0;padding:28px}
  .map-panel{width:340px;flex-shrink:0;padding:20px;position:sticky;top:20px}

  .q-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
  .q-count{font-size:14px;font-weight:600;color:var(--text-dim);font-variant-numeric:tabular-nums}
  .status-chip{
    font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.02em;
  }
  .chip-none{background:var(--grey);color:var(--text-dim)}
  .chip-correct{background:var(--green-soft);color:var(--green)}
  .chip-wrong{background:var(--red-soft);color:var(--red)}

  .progress{height:6px;border-radius:99px;background:var(--grey);overflow:hidden;margin-bottom:20px}
  .progress > div{height:100%;border-radius:99px;background:linear-gradient(90deg,#0a84ff,#34c759);transition:width .3s ease}

  .q-text{font-size:19px;font-weight:600;line-height:1.45;letter-spacing:-.01em;margin-bottom:20px;white-space:pre-wrap}

  .options{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;cursor:pointer;
    font:inherit;font-size:15.5px;line-height:1.45;color:var(--text);
    padding:14px 16px;border-radius:18px;border:1px solid var(--stroke);
    background:var(--option-bg);transition:background .18s ease, border-color .18s ease, transform .1s ease;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .opt:hover{background:var(--option-hover)}
  .opt:active{transform:scale(.99)}
  .opt .key{
    flex-shrink:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;background:var(--grey);color:var(--text-dim);margin-top:1px;
    transition:background .2s,color .2s;
  }
  .opt.correct{background:var(--green-soft);border-color:transparent}
  .opt.correct .key{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-soft);border-color:transparent}
  .opt.wrong .key{background:var(--red);color:#fff}
  .opt.dimmed{opacity:.55;pointer-events:none}
  .locked .opt{cursor:default}
  .locked .opt:hover{background:var(--option-bg)}

  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
  .nav .btn{min-width:110px;text-align:center}
  .nav .btn[disabled]{opacity:.35;cursor:default;pointer-events:none}

  /* ---------- question map ---------- */
  .map-title{font-size:13px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
  .map-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
  .map-toggle{
    width:30px;height:30px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .map-toggle svg{transition:transform .2s ease}
  .map-panel.collapsed .map-toggle svg{transform:rotate(180deg)}
  .map-panel.collapsed{display:flex;align-items:center}
  .map-panel.collapsed .map-head{width:100%;margin-bottom:0}
  .map-panel.collapsed .qmap{display:none}
  .qmap{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;container-type:inline-size;margin-inline:auto;width:100%;max-width:330px}
  .cell{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:clamp(8px,3.4cqw,13px);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;overflow:hidden;
    border-radius:9px;background:var(--grey);color:var(--text-dim);border:2px solid transparent;
    transition:transform .1s ease, background .2s ease;padding:0;
  }
  .cell:hover{transform:scale(1.1)}
  .cell.g{background:var(--green-soft);color:var(--green)}
  .cell.r{background:var(--red-soft);color:var(--red)}
  .cell.current{background:var(--accent);color:#fff;border-color:transparent;box-shadow:none}

  /* ---------- mobile (portrait / narrow) ---------- */
  @media (max-width:768px){
    .app{padding:12px 12px 32px}
    .layout{flex-direction:column}
    .map-panel{width:100%;position:static;order:2}
    .q-panel{padding:20px 18px;order:1}
    .q-text{font-size:17px}
    header{flex-wrap:nowrap;gap:10px;padding:12px 14px}
    h1{font-size:14px;white-space:nowrap}
    header{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>NZ ATPL Human Factors</h1>
    <div class="spacer"></div>
    <button class="btn ghost-danger" id="resetBtn">Reset Quiz</button>
    <button class="btn theme-toggle" id="themeBtn" aria-label="Toggle light / dark mode"></button>
  </header>

  <div class="layout">
    <section class="card q-panel" id="qPanel">
      <div class="q-top">
        <span class="q-count" id="qCount"></span>
        <span class="status-chip chip-none" id="chip">Unanswered</span>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="opts"></div>
      <div class="nav">
        <button class="btn" id="prevBtn">← Previous</button>
        <button class="btn" id="nextBtn">Next →</button>
      </div>
    </section>

    <aside class="card map-panel" id="mapPanel">
      <div class="map-head">
        <div class="map-title">Question Map</div>
        <button class="btn map-toggle" id="mapToggle" aria-label="Minimize question map"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
      </div>
      <div class="qmap" id="qmap"></div>
    </aside>
  </div>
</div>

<script>
const DATA = {"questions": [{"n": 1, "q": "A early physiological symptom common to both hypoxia and hyperventilation is:", "opts": {"a": "Immediate loss of peripheral hearing capability.", "b": "Severe chest pressure and acute pulmonary edema.", "c": "Tingling sensations in the fingers, toes, and lips (paresthesia).", "d": "Instantaneous cyanosis of the fingernail beds."}}, {"n": 2, "q": "What is the primary risk associated with flight crew 'Distrust' or 'Under-reliance' on flight deck automation systems?", "opts": {"a": "Over-dependence leading to loss of basic hand-flying skills.", "b": "Involuntary activation of emergency descent modes.", "c": "Excessive workload and heightened stress resulting from manually flying complex profiles when automation would provide superior safety margins.", "d": "Automated system hardware overheating due to lack of use."}}, {"n": 3, "q": "What is the primary objective of Crew Resource Management (CRM) training in multi-pilot flight operations?", "opts": {"a": "To replace standard operating procedures (SOPs) with flexible informal agreements.", "b": "To optimize the use of all available resources (hardware, software, human, and information) to enhance safety and efficiency.", "c": "To eliminate all mechanical equipment failures on modern jet aircraft.", "d": "To teach co-pilots how to take over command from senior captains without notice."}}, {"n": 4, "q": "In Endsley's model, the highest level of Situational Awareness (Level 3) is:", "opts": {"a": "Perception of visual indicators.", "b": "Projection of future status (ability to project how the situation will evolve in the near future).", "c": "Memorization of emergency procedures.", "d": "Comprehension of past flight leg data."}}, {"n": 5, "q": "What distinguishes an Explosive Decompression from a Rapid Decompression?", "opts": {"a": "Rapid decompression causes structural airframe damage, whereas explosive decompression only affects cabin windows.", "b": "Explosive decompression occurs only below 10,000 feet, while rapid decompression occurs above FL300.", "c": "Rapid decompression results in zero misting, whereas explosive decompression creates extreme heat.", "d": "Explosive decompression occurs faster than the lungs can naturally decompress (typically under 0.5 seconds), risking lung tissue damage."}}, {"n": 6, "q": "What occurs during an 'Automation Mode Reversion' in a modern jet transport flight guidance system?", "opts": {"a": "The system automatically drops from a high-level guidance mode (e.g. VNAV/LNAV) to a lower-level basic mode (e.g. Vertical Speed or FLCH) when flight envelope boundaries or target constraints are violated.", "b": "The aircraft engine controls revert to mechanical manual cable operation.", "c": "The autopilot completely shuts off electric power to the flight deck instruments.", "d": "The primary flight displays switch display languages automatically."}}, {"n": 7, "q": "What is the recommended maximum duration for a controlled rest period in the cockpit to avoid entering deep NREM Stage 3/4 sleep?", "opts": {"a": "15 minutes absolute maximum.", "b": "3 hours continuous sleep.", "c": "90 to 120 minutes.", "d": "30 to 45 minutes max (rest opportunity up to 45 min, actual sleep ~20-30 min)."}}, {"n": 8, "q": "In Endsley's Situational Awareness model, Level 2 SA is defined as:", "opts": {"a": "Physical manipulation of flight deck controls.", "b": "Perception of raw data displays.", "c": "Comprehension of the current situation (integrating Level 1 facts to understand their operational impact).", "d": "Projection of future fuel burn and trajectory."}}, {"n": 9, "q": "Under international aviation safety guidelines, what is the maximum recommended radiation dose limit for a pregnant crew member for the remainder of pregnancy?", "opts": {"a": "1 millisievert (1 mSv)", "b": "20 millisieverts (20 mSv)", "c": "50 millisieverts (50 mSv)", "d": "100 millisieverts (100 mSv)"}}, {"n": 10, "q": "An effective post-flight CRM debriefing should be conducted based on which core principle?", "opts": {"a": "An open, objective discussion focusing on 'what went right and what could be improved', encouraging constructive feedback regardless of rank.", "b": "A quick sign-off sheet completed without speaking to one another.", "c": "A formal lecture where the captain lists all mistakes made by the first officer.", "d": "An informal argument where crew defend their personal reputations at all costs."}}, {"n": 11, "q": "When a highly experienced flight crew encounters a complex, unprecedented dual hydraulic failure in flight, how does their cognitive processing shift within Rasmussen's SRK framework?", "opts": {"a": "Directly to intuitive subconscious guessing without analysis.", "b": "From Knowledge-based reasoning to automatic Skill-based reflexes.", "c": "To rigid adherence to basic VFR circuit patterns.", "d": "From automatic Skill-based and Rule-based execution to high-cognitive-demand Knowledge-based problem solving."}}, {"n": 12, "q": "During a multi-system failure, 'Cognitive Tunneling' degrades flight crew performance primarily by:", "opts": {"a": "Fixating hyper-focused attention on a single minor system fault while neglecting primary flight path control and terrain avoidance.", "b": "Increasing multi-tasking processing capacity to unsustainable levels.", "c": "Forcing the crew to speak in radio code instead of standard phraseology.", "d": "Causing simultaneous short-term and long-term memory amnesia."}}, {"n": 13, "q": "What is the operational rule known as the 'Two-Challenge Rule' on multi-pilot flight decks?", "opts": {"a": "A candidate is allowed two retakes before failing an ATPL simulator check.", "b": "If the Pilot Flying fails to respond to two consecutive verbal challenges regarding an unsafe flight condition, the Pilot Monitoring must assume control.", "c": "A pilot may only challenge the Captain's decisions twice per flight sector.", "d": "ATC must issue two separate warnings before a flight crew can initiate a go-around."}}, {"n": 14, "q": "At Flight Level 450 (FL450), why is the Time of Useful Consciousness (TUC) strictly limited to 9 to 12 seconds, regardless of individual physical fitness?", "opts": {"a": "Heart rate instantly drops to zero upon exposure to FL450 ambient pressure.", "b": "Physical fitness causes faster metabolic consumption of brain glucose.", "c": "The human body suffers immediate skeletal muscular paralysis at ambient pressures below 150 hPa.", "d": "9 to 12 seconds represents the circulation time required for deoxygenated blood leaving the lungs to reach the brain cortex."}}, {"n": 15, "q": "A flight deck characterized by a 'Steep Authority Gradient' is one in which:", "opts": {"a": "The captain is overly dominant, making junior crew members reluctant to speak up or challenge errors.", "b": "The captain and first officer share equal command authority without clear role division.", "c": "Both pilots strictly follow democratic consensus for every normal checklist item.", "d": "The first officer makes all tactical operational decisions while the captain handles radio ATC."}}, {"n": 16, "q": "How does chronic cigarette smoking affect a pilot's altitude tolerance?", "opts": {"a": "Smoking completely prevents decompression sickness.", "b": "Carbon monoxide in smoke binds to hemoglobin, reducing blood oxygen capacity and lowering physiological altitude tolerance by 2,000 to 5,000 feet.", "c": "Smoking expands lung volume, delaying the onset of hypoxic hypoxia.", "d": "Nicotine increases oxygen absorption, raising altitude tolerance by 3,000 feet."}}, {"n": 17, "q": "What causes the Somatogravic Illusion during a rapid acceleration on takeoff in Instrument Meteorological Conditions (IMC)?", "opts": {"a": "Inertial force pushes otolith maculae backward, creating a false sensation of pitching up steep, leading the pilot to push the nose down.", "b": "High atmospheric pressure in IMC compresses the middle ear fluids.", "c": "Rapid roll rates stimulate semicircular canals to create a false yaw feeling.", "d": "Visual light refraction through the windscreen creates an illusion of high terrain."}}, {"n": 18, "q": "According to Jens Rasmussen's cognitive model, what is the difference between a Rule-based mistake and a Knowledge-based mistake?", "opts": {"a": "Rule-based mistakes involve applying an inappropriate rule to a familiar situation; knowledge-based mistakes occur when formulating a plan in an unfamiliar situation where no rules exist.", "b": "Rule-based mistakes are deliberate violations; knowledge-based mistakes are physical slips.", "c": "Rule-based mistakes occur only during takeoff; knowledge-based mistakes occur only during landing.", "d": "Knowledge-based mistakes are automatic memory lapses; rule-based mistakes are radio errors."}}, {"n": 19, "q": "What is the final step in the DODAR structured decision-making model?", "opts": {"a": "Review (Monitoring and evaluating the outcome of the implemented decision).", "b": "Reschedule (Updating the flight plan ETA).", "c": "Refuel (Calculating required fuel reserves).", "d": "Report (Filing a safety incident report post-flight)."}}, {"n": 20, "q": "Consider a scenario: A crew is operating into a mountain airport at night in heavy rain (Latent Threat). ATC issues an ambiguous descent clearance (Operational Threat). The crew fails to cross-verify the clearance and descends below minimum vectoring altitude (Crew Error), resulting in a EGPWS 'TERRAIN TERRAIN' pull-up warning. In TEM terms, the EGPWS activation represents:", "opts": {"a": "A procedural slip by ATC.", "b": "An Organizational Failure of the EGPWS manufacturer.", "c": "An Environmental Threat.", "d": "An Undesirable Aircraft State (UAS) requiring immediate recovery maneuver (escape pull-up)."}}, {"n": 21, "q": "Why is the euphoric phase of hypoxia particularly dangerous in multi-crew flight deck environments?", "opts": {"a": "It dramatically increases heart rate causing instant loss of consciousness.", "b": "It impairs self-criticism and judgment, leading the pilot to feel falsely confident while making severe operational errors.", "c": "It induces severe violent behavior toward the other flight crew member.", "d": "It causes immediate physical paralysis, preventing crew from reaching the radio."}}, {"n": 22, "q": "In James Reason's Swiss Cheese Model of systemic accidents, how does an accident actually occur?", "opts": {"a": "When weakness gaps ('holes') across multiple defensive layers align simultaneously, allowing a hazard trajectory to breach all defenses.", "b": "When a single frontline pilot makes one slip without any organizational involvement.", "c": "When aircraft engines experience catastrophic mechanical disintegration without prior warning.", "d": "When flight crew fail to update the FMS navigation database."}}, {"n": 23, "q": "In James Reason's Just Culture decision framework, what is the purpose of the 'Substitution Test' when evaluating an operational error?", "opts": {"a": "To replace the pilot involved in the incident with a new crew member permanently.", "b": "To substitute written flight procedures with informal verbal guidelines.", "c": "To test whether aircraft hardware can be substituted with secondary backup units.", "d": "To ask whether two other peers with similar training and experience would have made the same error in the same operational context."}}, {"n": 24, "q": "Biochemically, why does severe hyperventilation progress to Carpopedal Spasm (painful involuntary cramping of hands and feet)?", "opts": {"a": "Excessive oxygen in the bloodstream causes muscle cell necrosis.", "b": "Respiratory alkalosis causes a decrease in free ionized plasma calcium ($Ca^{2+}$), increasing neuromuscular excitability and triggering tetany.", "c": "Lactic acid builds up rapidly in peripheral muscles due to lack of glucose.", "d": "Carbon dioxide gas bubbles block nerve impulse conduction in peripheral motor neurons."}}, {"n": 25, "q": "Why is the 'Graveyard Spiral' particularly fatal if a pilot relies on bodily sensations rather than cross-checking instruments?", "opts": {"a": "The aircraft engines automatically flame out due to high G-loading.", "b": "As fluid in semicircular canals reaches equilibrium during a prolonged steep turn, the pilot feels level; pulling back on controls to stop altitude loss tightens the spiral bank angle and accelerates descent rate.", "c": "The pilot suffers total loss of vision due to extreme negative G-forces.", "d": "The instrument displays freeze automatically due to high spin rates."}}, {"n": 26, "q": "What is the primary origin of Galactic Cosmic Rays (GCR) that contribute to radiation exposure in high-altitude aviation?", "opts": {"a": "High-energy atomic nuclei originating outside our solar system.", "b": "Electromagnetic radiation emitted directly by aircraft radar units.", "c": "Thermal radiation trapped in the upper stratosphere by greenhouse gases.", "d": "Low-frequency radio emissions from ionospheric reflections."}}, {"n": 27, "q": "Why is jet lag (circadian dysrhythmia) generally more severe after flying eastward across multiple time zones than westward?", "opts": {"a": "Westward travel forces the body clock to sleep earlier than normal.", "b": "Eastward travel causes higher cosmic radiation exposure.", "c": "Eastward flights travel against Earth's rotational magnetic field.", "d": "Eastward travel requires shortening (phase advancing) the circadian cycle, which is harder for the body clock than lengthening it."}}, {"n": 28, "q": "What is the Window of Circadian Low (WOCL)?", "opts": {"a": "The transition window between Stage 4 sleep and REM sleep.", "b": "The timeframe between 12:00 and 14:00 immediately following lunch.", "c": "The period between 02:00 and 06:00 when body temperature, alertness, and performance reach their lowest physiological trough.", "d": "The period of reduced solar radiation exposure during nighttime flights."}}, {"n": 29, "q": "What is the third step 'C' in the PACE assertiveness model?", "opts": {"a": "Concede (Deferring to captain's error without further statement).", "b": "Checklist (Reading out the normal checklist).", "c": "Challenge (Issuing a clear, direct challenge stating the hazard and required action).", "d": "Complain (Expressing personal frustration about roster fatigue)."}}, {"n": 30, "q": "An Undesirable Aircraft State (UAS) is defined in TEM as:", "opts": {"a": "A disagreement between the captain and first officer regarding fuel policy.", "b": "Any mechanical failure that forces an immediate in-flight engine shutdown.", "c": "A ground delay caused by air traffic control slot restrictions.", "d": "An aircraft position, speed, attitude, or configuration deviation that reduces safety margins, resulting from mismanaged threats or errors."}}, {"n": 31, "q": "What is the operational definition of Time of Useful Consciousness (TUC)?", "opts": {"a": "The total time elapsed between decompression and complete loss of heart function.", "b": "The time required for cabin altitude pressure to equalize with outside ambient pressure.", "c": "The duration a pilot can survive at FL400 without supplemental oxygen.", "d": "The period of time from the loss of oxygen supply until an individual can no longer take effective deliberate action."}}, {"n": 32, "q": "During a sudden explosive depressurisation at FL410, why does venous blood returning to the lungs actually lose oxygen to the alveolar air space?", "opts": {"a": "Atmospheric nitrogen enters red blood cells and forces oxygen molecules out.", "b": "The rapid drop in ambient temperature inactivates pulmonary capillary pumps.", "c": "Carbon dioxide in alveolar air transforms into liquid carbonic acid.", "d": "Alveolar partial pressure of oxygen (PAO2) drops below mixed venous oxygen partial pressure (PvO2), reversing the normal partial pressure gradient."}}, {"n": 33, "q": "Which anatomical structure in the brain serves as the primary master clock regulating the human 24-hour circadian rhythm?", "opts": {"a": "Cerebellum in the hindbrain.", "b": "Medulla oblongata in the brainstem.", "c": "Hippocampus in the temporal lobe.", "d": "Suprachiasmatic Nucleus (SCN) in the hypothalamus."}}, {"n": 34, "q": "In human error terminology, how is a Routine Violation distinguished from an Exceptional Violation?", "opts": {"a": "Exceptional violations carry no legal penalty under civil aviation law.", "b": "Routine violations are accidental slips; exceptional violations are memory lapses.", "c": "Routine violations are normalized, everyday shortcuts condoned by group culture; exceptional violations are isolated, deliberate breaches during unusual circumstances.", "d": "Routine violations are committed by cabin crew; exceptional violations are committed by pilots."}}, {"n": 35, "q": "Cosmic radiation exposure for flight crews is highest at which altitudes and geographic locations?", "opts": {"a": "High altitudes and near the Earth's polar regions.", "b": "Sea level during summer months.", "c": "Low altitudes and near the equator.", "d": "Medium altitudes over landmasses with high mineral deposits."}}, {"n": 36, "q": "A 'Shallow Authority Gradient' on a flight deck introduces safety risks primarily because:", "opts": {"a": "The captain completely intimidates the first officer into total silence.", "b": "The flight guidance system disconnects automatically when authority gradients flatten.", "c": "Unclear command leadership and lack of firm decision-making can lead to confusion over who is ultimately in charge during critical situations.", "d": "The first officer refuses to speak English on international flights."}}, {"n": 37, "q": "How does a 'Somatogyral Illusion' affect a pilot rolling wings level after a prolonged constant-rate turn in clouds?", "opts": {"a": "Rolling wings level causes semicircular canal fluid to move in the opposite direction, creating a strong false sensation of turning in the opposite direction.", "b": "It causes the pilot to feel as if the aircraft is accelerating to supersonic speeds.", "c": "It creates a strong sensation of pitching up into a loop.", "d": "It induces severe visual color distortion."}}, {"n": 38, "q": "What is the primary difference between Acute Fatigue and Chronic Fatigue in flight crew members?", "opts": {"a": "Acute fatigue cannot be measured by bio-mathematical models.", "b": "Acute fatigue is caused by bad food; chronic fatigue is caused by high altitude.", "c": "Acute fatigue is short-term and resolved by a single good night's sleep; chronic fatigue accumulates over weeks/months and requires prolonged medical and operational rest.", "d": "Chronic fatigue only affects cabin crew, while acute fatigue affects pilots."}}, {"n": 39, "q": "Which of the following is classified as an Environmental Threat under the TEM model?", "opts": {"a": "Inadequate maintenance documentation provided by the home base engineering team.", "b": "Severe convective weather and mountain wave turbulence along the route.", "c": "Crew failure to set the correct altimeter subscale pressure setting.", "d": "Selecting FLCH instead of VNAV on the mode control panel."}}, {"n": 40, "q": "What does the abbreviation FRMS stand for in modern airline operations?", "opts": {"a": "Frequency Reduction and Maintenance Schedule", "b": "Flight Safety Risk Mitigation Strategy", "c": "Flight Crew Rest Monitoring System", "d": "Fatigue Risk Management System"}}, {"n": 41, "q": "Under high-workload emergency conditions, task prioritization must strictly follow which golden hierarchy?", "opts": {"a": "Navigate, System Management, Aviate, Communicate.", "b": "Communicate, Aviate, Navigate, Management.", "c": "System Management, Communicate, Navigate, Aviate.", "d": "Aviate, Navigate, Communicate, System Management."}}, {"n": 42, "q": "A Solar Particle Event (SPE) poses an immediate acute radiation hazard to high-altitude flights because:", "opts": {"a": "Coronal mass ejections release intense fluxes of high-energy solar protons that can dramatically elevate radiation dose rates at FL350+.", "b": "Solar flares instantly blind pilot vision through cockpit windows.", "c": "Solar particles melt satellite GPS receivers, causing immediate flight instrument loss.", "d": "Solar storms heat upper atmospheric air to over 100 degrees Celsius."}}, {"n": 43, "q": "Which SI unit is officially used to measure cumulative ionizing radiation dose equivalent received by aircrew?", "opts": {"a": "Hertz (Hz)", "b": "Gray (Gy)", "c": "Becquerel (Bq)", "d": "Sievert (Sv) / Millisievert (mSv)"}}, {"n": 44, "q": "Barodontalgia (tooth pain at altitude) is primarily caused by:", "opts": {"a": "Excessive saliva production caused by high cabin altitude pressure changes.", "b": "Reduced oxygen supply to the dental pulp causing local hypemic hypoxia.", "c": "Expansion of gas trapped under defective dental restorations or in tooth root pockets during ascent.", "d": "Contraction of air pockets in healthy teeth during rapid descent."}}, {"n": 45, "q": "Why is middle ear barotrauma more likely to occur during aircraft descent than during climb?", "opts": {"a": "Increasing ambient pressure forces the Eustachian tube closed like a flutter valve, trapping lower pressure in the middle ear.", "b": "The Eustachian tube opens automatically during descent but seals tightly during climb.", "c": "Ambient humidity increases during descent, blocking gas equalization in the inner ear.", "d": "Decreasing ambient pressure during descent forces gas out of the middle ear into the nasal cavity."}}, {"n": 46, "q": "In James Reason's human error taxonomy, a 'Slip' is defined as:", "opts": {"a": "An unintended action where the plan was correct but execution failed physically.", "b": "A total memory failure where a checklist step is entirely forgotten.", "c": "An incorrect plan formulated due to lack of knowledge about aircraft systems.", "d": "A deliberate departure from standard operating procedures for personal gain."}}, {"n": 47, "q": "Why is 'closed-loop communication' critical on a multi-pilot flight deck?", "opts": {"a": "It prevents cabin crew from intercepting flight deck intercom audio.", "b": "It speeds up communication by using single-word shorthand.", "c": "It eliminates the need for written checklists.", "d": "It ensures the sender receives confirmation that the recipient heard, understood, and correctly acknowledged the exact message."}}, {"n": 48, "q": "Human Short-Term (Working) Memory capacity is generally accepted to be limited to approximately how many items or chunks of information?", "opts": {"a": "Unlimited capacity for up to 2 hours", "b": "1 to 2 items maximum", "c": "7 +/- 2 items (5 to 9 items)", "d": "15 to 20 items"}}, {"n": 49, "q": "In Mica Endsley's model of Situational Awareness (SA), Level 1 SA corresponds to:", "opts": {"a": "Projection of future status and trajectory.", "b": "Execution of emergency checklist items.", "c": "Comprehension of the current situation.", "d": "Perception of the elements in the environment (seeing, hearing, and noticing critical data)."}}, {"n": 50, "q": "Which physiological classification of hypoxia is caused by a reduction in the partial pressure of oxygen in inspired air at high altitude?", "opts": {"a": "Stagnant Hypoxia", "b": "Hypemic Hypoxia", "c": "Histotoxic Hypoxia", "d": "Hypoxic Hypoxia"}}, {"n": 51, "q": "What is 'Habit Capture' in aviation human factors?", "opts": {"a": "A pilot becoming addicted to caffeine during long-haul flights.", "b": "Failing to read normal checklists due to laziness.", "c": "Consistently selecting wrong autopilot modes due to poor training.", "d": "Inadvertently performing a highly practiced routine action instead of a newly intended non-routine action."}}, {"n": 52, "q": "How does exposure to short-wavelength blue light (such as electronic tablet screens or bright flight deck lighting) suppress melatonin secretion and affect crew rest timing?", "opts": {"a": "Blue light increases pineal melatonin secretion, causing sudden un-restorative sleepiness.", "b": "Blue light destroys melatonin molecules directly inside blood capillaries.", "c": "Blue light directly stimulates intrinsically photosensitive retinal ganglion cells (ipRGCs), signaling the SCN to suppress pineal melatonin release and delaying sleep onset.", "d": "Blue light induces rapid eye movement (REM) sleep phase during active flight duty."}}, {"n": 53, "q": "In Threat and Error Management (TEM), how does an Organizational Threat differ from an Environmental Threat?", "opts": {"a": "Organizational threats are caused directly by flight crew errors, whereas environmental threats are caused by ATC.", "b": "Environmental threats only occur on the ground, whereas organizational threats occur in flight.", "c": "Organizational threats can be completely eliminated by the flight crew.", "d": "Organizational threats originate from within the airline management structure (e.g. roster pressure, maintenance defects), whereas environmental threats originate externally."}}, {"n": 54, "q": "If a Captain becomes subtly incapacitated during a complex instrument approach in IMC, what is the mandatory immediate action required of the First Officer?", "opts": {"a": "Waiting for ATC to notice altitude deviations on radar and issue instructions.", "b": "Leaving the flight deck seat to fetch emergency medical kits from the cabin.", "c": "Clear, immediate takeover of control ('I have control'), engaging autopilot/flight guidance, and executing a missed approach to establish a safe altitude.", "d": "Continuing down to decision altitude while repeatedly tapping the captain's shoulder."}}, {"n": 55, "q": "In James Reason's Organizational Accident model, how do 'Latent Conditions' differ fundamentally from 'Active Failures'?", "opts": {"a": "Latent conditions are errors made by co-pilots; active failures are errors made by captains.", "b": "Active failures remain dormant for years, whereas latent conditions produce instant warnings.", "c": "Latent conditions are present in the system long before an accident (e.g. flawed design, poor maintenance procedures, high-workload schedules); active failures are committed by frontline operators at the immediate time of the event.", "d": "Latent conditions occur only in IMC flight; active failures occur in VMC."}}, {"n": 56, "q": "Bio-mathematical fatigue prediction models in FRMS rely primarily on which core inputs?", "opts": {"a": "Sleep/wake history, duty timing, circadian phase, and workload intensity.", "b": "Aircraft gross weight and cruise altitude.", "c": "Cabin air pressure and humidity levels.", "d": "Pilot age, body mass index, and blood sugar levels."}}, {"n": 57, "q": "The visual illusion of 'Autokinesis' occurs when a pilot:", "opts": {"a": "Executes a steep turn while looking at the horizon.", "b": "Approaches a runway with bright LED lights under heavy rain.", "c": "Flies over a sloping runway covered in snow.", "d": "Stares continuously at a single stationary point of light in a dark, featureless environment, causing the light to appear to move."}}, {"n": 58, "q": "A night approach over unlit terrain or water toward a well-lit runway ('Black Hole Approach') frequently tricks pilots into:", "opts": {"a": "Perceiving they are below glideslope, leading to flying an excessively high approach.", "b": "Perceiving they are higher than they actually are, leading to flying a dangerously low approach path.", "c": "Experiencing sudden temporal lobe seizures.", "d": "Feeling that the aircraft is rolling rapidly to the left."}}, {"n": 59, "q": "In the PACE assertiveness model, if the 'Probe' fails to produce a response or correction, what is the second step 'A'?", "opts": {"a": "Action (Disconnecting the autopilot unannounced).", "b": "Alert (Stating a specific, direct concern regarding the situation).", "c": "Advise ATC (Reporting the captain to air traffic control).", "d": "Abandon (Executing a missed approach without stating why)."}}, {"n": 60, "q": "In an airline FRMS, when evaluating an ultra-long-haul (ULH) pairing, a bio-mathematical fatigue score indicating high fatigue risk during the top-of-descent phase requires which organizational response?", "opts": {"a": "Filing a mandatory disciplinary infraction against the roster planning clerk.", "b": "Reducing the flight crew complement from 4 pilots to 2 pilots.", "c": "Formal Safety Risk Assessment (SRA) to introduce specific mitigations, such as augmented crew staffing, controlled rest, or roster restructuring.", "d": "Immediate cancellation of all flights operated by that aircraft type."}}, {"n": 61, "q": "The final step 'E' in the PACE assertiveness algorithm is executed when:", "opts": {"a": "The captain successfully corrects the altitude deviation after step 1.", "b": "Radio communication with ATC is momentarily interrupted.", "c": "Flight crew land at an alternate airport.", "d": "Emergency action (taking control or forcing immediate intervention) is necessary to prevent an imminent catastrophic outcome."}}, {"n": 62, "q": "Carbon monoxide inhalation from engine exhaust gas leaking into the cabin causes which specific type of hypoxia?", "opts": {"a": "Stagnant Hypoxia", "b": "Hypoxic Hypoxia", "c": "Histotoxic Hypoxia", "d": "Hypemic (Anemic) Hypoxia"}}, {"n": 63, "q": "Following a decompression at Flight Level 400 (FL400), a pilot's Time of Useful Consciousness (TUC) is approximately:", "opts": {"a": "3 to 5 minutes", "b": "30 to 60 seconds", "c": "1 to 2 minutes", "d": "15 to 20 seconds"}}, {"n": 64, "q": "The development of decompression sickness (bends, chokes, neurological symptoms) following rapid depressurisation is governed by which physical law?", "opts": {"a": "Gay-Lussac's Law", "b": "Henry's Law", "c": "Dalton's Law", "d": "Boyle's Law"}}, {"n": 65, "q": "Why is an un-annunciated Autothrottle mode change during a VNAV descent a classic trigger for Automation Surprise?", "opts": {"a": "It causes immediate physical engine flameout.", "b": "It disconnects cabin pressurization controllers.", "c": "It locks the flight control yoke in a fixed pitch-up angle.", "d": "If the autothrottle shifts unexpectedly from SPEED to HOLD mode, pitch control may alter pitch to maintain path, causing speed to decay unnoticed if FMA monitoring is neglected."}}, {"n": 66, "q": "When a major Solar Particle Event (SPE) triggers an official space weather alert (e.g. NOAA S3 or higher), flight operations at FL350+ on polar routes are required to take which tactical action?", "opts": {"a": "Turn off all aircraft flight deck CRTs and GPS receivers.", "b": "Instruct passengers to wear emergency oxygen masks.", "c": "Increase cruise speed to Mach 0.86 to exit the radiation zone quickly.", "d": "Initiate an in-flight descent to lower flight levels (e.g. below FL310) or divert away from high polar latitudes to increase atmospheric shielding."}}, {"n": 67, "q": "In human error taxonomy, a memory failure leading to the inadvertent omission of an item on a landing checklist is termed a:", "opts": {"a": "Lapse", "b": "Violation", "c": "Mistake", "d": "Slip"}}, {"n": 68, "q": "Why is relying solely on Mode Control Panel (MCP) selection lights considered a dangerous automation management practice?", "opts": {"a": "MCP selections automatically disconnect the autothrottle.", "b": "MCP lights only confirm button selection request, not that the mode is armed or actively engaged by the flight guidance computer.", "c": "MCP push-buttons burn out frequently in flight.", "d": "MCP lights switch off whenever the autopilot is engaged."}}, {"n": 69, "q": "Following a sudden explosive depressurisation at FL350, why is a pilot's TUC reduced by up to 50% compared to a gradual loss of pressure?", "opts": {"a": "The rapid drop in temperature freezes oxygen molecules in the bloodstream.", "b": "The blood pressure drops instantly to zero due to ambient vacuum.", "c": "Adrenaline release consumes all stored venous blood oxygen instantly.", "d": "Forced exhalation and rapid expansion of lung gas leads to reverse diffusion of oxygen out of pulmonary blood into the alveoli."}}, {"n": 70, "q": "Physiologically, why does the human body clock adapt to a Phase Delay (westward transmeridian flight) at a rate of ~1.5 hours per day, compared to only ~1.0 hour per day for a Phase Advance (eastward flight)?", "opts": {"a": "Eastward flights experience higher gravitational forces due to Earth's rotation.", "b": "Westward travel causes greater suppression of cortisol than eastward travel.", "c": "Westward flights fly in the same direction as atmospheric jet stream winds.", "d": "The endogenous circadian pacemaker naturally runs slightly longer than 24 hours (tau ~24.2h), making it easier to extend the biological day than compress it."}}, {"n": 71, "q": "What is the primary operational hazard of 'Micro-sleeps' occurring during long-haul cruise monitoring phases?", "opts": {"a": "Micro-sleeps are involuntary 1-to-15 second sleep episodes that occur without pilot awareness, causing complete loss of instrument monitoring and response capability.", "b": "Micro-sleeps instantly trigger autopilot emergency disconnect alarms.", "c": "Micro-sleeps only occur when pilots are operating in manual flight mode.", "d": "Micro-sleeps induce severe permanent neurological brain damage."}}, {"n": 72, "q": "In a multi-pilot crew structure, what is the core responsibility of the Pilot Monitoring (PM)?", "opts": {"a": "Actively monitoring aircraft flight path, instrument indications, systems, and cross-checking Pilot Flying (PF) actions.", "b": "Solely handling communications with cabin crew while taking no part in flight path oversight.", "c": "Operating the primary flight controls while the PF monitors radio communications.", "d": "Reviewing passenger manifests and cabin meal services during approach."}}, {"n": 73, "q": "The Threat and Error Management (TEM) framework categorizes operational challenges into three primary elements:", "opts": {"a": "Threats, Errors, and Undesirable Aircraft States.", "b": "Inputs, Processes, and Outputs.", "c": "Weather, Mechanical, and Human Hazards.", "d": "Failures, Violations, and Incidents."}}, {"n": 74, "q": "In the PACE standardized assertiveness model, what does the first step 'P' represent?", "opts": {"a": "Proclaim (Declaring an emergency on radio frequency).", "b": "Push (Taking control of aircraft flight controls immediately).", "c": "Panic (Calling cabin crew to enter flight deck).", "d": "Probe (Asking a non-confrontational question to draw attention to an anomaly)."}}, {"n": 75, "q": "In decompression sickness, 'The Chokes' is a life-threatening physiological manifestation caused by:", "opts": {"a": "Swallowing expanding air pockets into the esophagus.", "b": "Nitrogen micro-bubbles micro-embolizing the pulmonary circulation, causing severe chest pain, dyspnea, and non-productive cough.", "c": "Spasmic closure of the vocal cords due to cold cabin air.", "d": "Mucus blockage of the upper trachea secondary to hyperventilation."}}, {"n": 76, "q": "What is the fundamental principle of a 'Just Culture' within an aviation organization?", "opts": {"a": "A culture where the captain is always held financially liable for all flight delays.", "b": "A strict zero-tolerance policy where any error results in immediate dismissal.", "c": "A policy granting total immunity from prosecution for all actions committed on duty.", "d": "An atmosphere of trust where honest errors and safety reports are non-punitive, but reckless behavior and gross negligence are not tolerated."}}, {"n": 77, "q": "What is the physiological mechanism responsible for generating the dangerous 'Coriolis Illusion' during Instrument Meteorological Conditions?", "opts": {"a": "Rapid change in cabin pressure causes fluid expansion inside the vestibular otoliths.", "b": "Linear acceleration in a straight line stimulates the cochlea to generate auditory hallucinations.", "c": "Abrupt head movement in a plane different from a constant-rate turn stimulates a second set of semicircular canals, creating a violent false perception of tumbling or roll.", "d": "Light reflection off cloud layers causes rapid nystagmus of the pupil."}}, {"n": 78, "q": "Pooling of blood in the lower extremities during prolonged positive G-load maneuvers induces which type of hypoxia?", "opts": {"a": "Hypemic Hypoxia", "b": "Histotoxic Hypoxia", "c": "Stagnant Hypoxia", "d": "Hypoxic Hypoxia"}}, {"n": 79, "q": "How does 'The Leans' vestibular illusion occur during instrument flight?", "opts": {"a": "Deceleration on landing roll creates a false pitch-up feeling.", "b": "Looking down at charts during a turn causes extreme dizziness.", "c": "A steep climbing turn causes rapid movement of fluid in all three semicircular canals simultaneously.", "d": "A slow undetected roll below human sensory threshold followed by a rapid leveling creates a false perception of banking in the opposite direction."}}, {"n": 80, "q": "How does acute psychological stress affect human decision-making performance during flight deck abnormalities?", "opts": {"a": "It increases working memory capacity and enhances analytical reasoning speed.", "b": "It forces the brain to systematically consider all non-standard alternative options.", "c": "It completely prevents physical movement of hand controls.", "d": "It induces premature closure, where crew jump to conclusions and select the first available option without thorough risk assessment."}}, {"n": 81, "q": "Under conditions of abnormally high cognitive workload, human visual perception tends to experience:", "opts": {"a": "Channelized attention (tunnel vision), narrowing focus to a single display while ignoring peripheral inputs.", "b": "Complete temporary blindness across both eyes.", "c": "Involuntary rapid eye movement preventing any visual intake.", "d": "Expanded peripheral vision with heightened multi-tasking ability."}}, {"n": 82, "q": "During a non-normal flight deck event, 'Confirmation Bias' poses a severe hazard because pilots tend to:", "opts": {"a": "Reject correct advice given by ATC.", "b": "Immediately disconnect autopilot systems without checking altitude.", "c": "Systematically re-evaluate all assumptions every 30 seconds.", "d": "Seek out and accept information that supports their initial hypothesis while ignoring contradictory evidence."}}, {"n": 83, "q": "Which command leadership style is most appropriate during a severe, time-critical emergency in flight?", "opts": {"a": "Consultative / Democratic (Captain conducts a lengthy vote among all crew members).", "b": "Directive / Authoritative (Captain gives clear, direct orders without extended debate).", "c": "Passive-Permissive (Captain avoids making any decisions until ATC instructs).", "d": "Laissez-faire (Captain steps back completely and lets the crew choose actions independently)."}}, {"n": 84, "q": "Sleep inertia is best defined as:", "opts": {"a": "A period of temporary grogginess, disorientation, and impaired cognitive performance immediately following awakening.", "b": "Uncontrolled sleep paralysis occurring during rapid altitude changes.", "c": "Continuous micro-sleeping while monitoring automated instruments in cruise.", "d": "Inability to fall asleep despite severe physical exhaustion."}}, {"n": 85, "q": "When an aviation positive-pressure breathing oxygen system is activated at extreme high altitude (above FL400), breathing mechanics are reversed because:", "opts": {"a": "Oxygen is absorbed through the skin rather than pulmonary alveoli.", "b": "The pilot must swallow oxygen gas into the stomach rather than lungs.", "c": "Inhalation is passive as oxygen is forced into the lungs under pressure, while exhalation requires active muscular effort.", "d": "Inhalation requires maximum abdominal effort while exhalation is automatic."}}, {"n": 86, "q": "What operational phenomenon is referred to as 'Automation Surprise'?", "opts": {"a": "When the automated flight system behaves in a manner unexpected by the flight crew, prompting questions like 'What is it doing now?'.", "b": "When weather radar detects unexpected clear air turbulence.", "c": "When new avionics software is installed without notifying the airline pilot union.", "d": "When the autopilot disconnects silently during smooth level cruise flight."}}, {"n": 87, "q": "Which operational condition is mandatory before a flight crew member may initiate controlled cockpit rest?", "opts": {"a": "It requires written approval from ATC on frequency prior to closing eyes.", "b": "It can be taken by both pilots simultaneously if the autopilot is engaged.", "c": "It can be taken during approach if weather is CAVOK.", "d": "It must occur strictly during low-workload cruise phase on a multi-pilot aircraft with explicit agreement of the non-resting pilot."}}, {"n": 88, "q": "How does hyperventilation affect blood pH balance?", "opts": {"a": "It has zero effect on blood chemistry.", "b": "It causes Respiratory Alkalosis (blood pH increases / becomes abnormally alkaline due to excessive loss of CO2).", "c": "It causes Respiratory Acidosis (blood pH decreases / becomes acidic due to CO2 accumulation).", "d": "It causes instant diabetic ketoacidosis."}}, {"n": 89, "q": "Which gas law explains the painful expansion of trapped gastrointestinal gas during a rapid climb to high flight levels?", "opts": {"a": "Charles's Law (Volume is directly proportional to absolute temperature).", "b": "Graham's Law (Effusion rate is inversely proportional to square root of mass).", "c": "Boyle's Law (Volume is inversely proportional to pressure at constant temperature).", "d": "Henry's Law (Gas dissolved in liquid is proportional to partial pressure)."}}, {"n": 90, "q": "Following a controlled cockpit rest period, how long is the mandatory recovery/buffer period before the resting pilot may resume active operational duties?", "opts": {"a": "Exact 60 minutes of physical exercise.", "b": "5 minutes minimum.", "c": "At least 15 to 20 minutes to allow sleep inertia to dissipate fully.", "d": "Immediately upon opening eyes."}}, {"n": 91, "q": "Where must flight crews primary check to confirm active and armed automatic flight control guidance modes?", "opts": {"a": "By looking at the illuminated push-buttons on the Mode Control Panel (MCP).", "b": "By checking the mechanical trim wheel movement rate.", "c": "On the central Flight Management System (FMS) scratchpad.", "d": "On the Flight Mode Annunciator (FMA) at the top of the Primary Flight Display (PFD)."}}, {"n": 92, "q": "In the FORDEC structured decision-making model, what does the letter 'R' stand for?", "opts": {"a": "Radio (Communicating with air traffic control).", "b": "Rules (Checking regulatory CAA compliance).", "c": "Readback (Verifying instrument entries).", "d": "Risks (Evaluating the risks associated with each identified option)."}}, {"n": 93, "q": "If a pilot at high altitude experiences symptoms of lightheadedness and tingling but cannot definitively distinguish between hypoxia and hyperventilation, what is the mandatory immediate action?", "opts": {"a": "Drink warm fluids to calm the nervous system.", "b": "Execute an immediate emergency descent without putting on the mask.", "c": "Don oxygen mask immediately and select 100% oxygen under pressure.", "d": "Remove oxygen mask and slow breathing rate down manually."}}, {"n": 94, "q": "What is the primary physiological mechanism behind hyperventilation?", "opts": {"a": "Inadequate ventilation causing toxic buildup of carbon dioxide in arterial blood.", "b": "Extreme rapid depletion of blood hemoglobin oxygen carrying capacity.", "c": "Excessive rate and depth of respiration causing abnormally high elimination of carbon dioxide (CO2) from the blood.", "d": "Spasmic contraction of the diaphragm blocking intake of atmospheric oxygen."}}, {"n": 95, "q": "Circadian Dysrhythmia is the formal medical term for which common aviation condition?", "opts": {"a": "Nitrogen narcosis resulting from rapid altitude change.", "b": "Vestibular disorientation during instrument meteorological conditions.", "c": "Jet lag caused by transmeridian flight across multiple time zones.", "d": "Acute hypoxia caused by rapid depressurisation."}}, {"n": 96, "q": "Which immediate physical indication occurs inside a flight deck during a rapid cabin depressurisation?", "opts": {"a": "Contraction of gas in open fluid containers.", "b": "A dramatic rise in ambient cabin temperature.", "c": "A sudden decrease in noise level as air exits.", "d": "Sudden misting or fogging caused by adiabatic cooling of expanding air."}}, {"n": 97, "q": "Severe alcohol consumption prior to flight impairs the body's ability to utilize oxygen at the cellular level. This is classified as:", "opts": {"a": "Histotoxic Hypoxia", "b": "Hypoxic Hypoxia", "c": "Stagnant Hypoxia", "d": "Hypemic Hypoxia"}}, {"n": 98, "q": "According to Dalton's Law, what happens to the partial pressure of oxygen in atmospheric air as altitude increases?", "opts": {"a": "It increases exponentially as atmospheric density decreases.", "b": "It decreases in direct proportion to the drop in total barometric pressure, while its percentage composition remains approximately 21%.", "c": "It remains constant because the percentage of oxygen increases at higher altitudes.", "d": "It drops to zero above FL180 due to the complete absence of atmospheric oxygen."}}, {"n": 99, "q": "At Flight Level 250 (FL250), what is the typical Time of Useful Consciousness (TUC) for a healthy pilot at rest?", "opts": {"a": "10 to 12 minutes.", "b": "30 to 60 seconds", "c": "3 to 5 minutes", "d": "15 to 20 seconds"}}, {"n": 100, "q": "At Flight Level 350 (FL350), what is the average Time of Useful Consciousness (TUC)?", "opts": {"a": "30 to 60 seconds", "b": "15 to 20 seconds", "c": "3 to 5 minutes", "d": "9 to 12 seconds"}}], "answers": {"1": "C", "2": "C", "3": "B", "4": "B", "5": "D", "6": "A", "7": "D", "8": "C", "9": "A", "10": "A", "11": "D", "12": "A", "13": "B", "14": "D", "15": "A", "16": "B", "17": "A", "18": "A", "19": "A", "20": "D", "21": "B", "22": "A", "23": "D", "24": "B", "25": "B", "26": "A", "27": "D", "28": "C", "29": "C", "30": "D", "31": "D", "32": "D", "33": "D", "34": "C", "35": "A", "36": "C", "37": "A", "38": "C", "39": "B", "40": "D", "41": "D", "42": "A", "43": "D", "44": "C", "45": "A", "46": "A", "47": "D", "48": "C", "49": "D", "50": "D", "51": "D", "52": "C", "53": "D", "54": "C", "55": "C", "56": "A", "57": "D", "58": "B", "59": "B", "60": "C", "61": "D", "62": "D", "63": "D", "64": "B", "65": "D", "66": "D", "67": "A", "68": "B", "69": "D", "70": "D", "71": "A", "72": "A", "73": "A", "74": "D", "75": "B", "76": "D", "77": "C", "78": "C", "79": "D", "80": "D", "81": "A", "82": "D", "83": "B", "84": "A", "85": "C", "86": "A", "87": "D", "88": "B", "89": "C", "90": "C", "91": "D", "92": "D", "93": "C", "94": "C", "95": "C", "96": "D", "97": "A", "98": "B", "99": "C", "100": "A"}};
const N = DATA.questions.length;
const LETTERS = ["a","b","c","d"];
const MOON_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const SUN_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
let picks = new Array(N).fill(null);   // picked letter per question, or null
let current = 0;

const $ = id => document.getElementById(id);
const qmap = $("qmap"), optsEl = $("opts");

/* ---------- theme ---------- */
const root = document.documentElement;
function setTheme(t){
  root.setAttribute("data-theme", t);
  $("themeBtn").innerHTML = t === "dark" ? SUN_ICON : MOON_ICON;
  try{ localStorage.setItem("hf-theme", t); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem("hf-theme"); }catch(e){}
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
})();
$("themeBtn").onclick = () => setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");

/* ---------- question map ---------- */
const cells = [];
for(let i=0;i<N;i++){
  const b = document.createElement("button");
  b.className = "cell"; b.textContent = i+1;
  b.setAttribute("aria-label","Go to question "+(i+1));
  b.onclick = () => { current = i; render(); };
  qmap.appendChild(b); cells.push(b);
}

/* ---------- map minimize ---------- */
const mapPanel = $("mapPanel"), mapToggle = $("mapToggle");
function setMap(open){
  mapPanel.classList.toggle("collapsed", !open);
  mapToggle.setAttribute("aria-label", open ? "Minimize question map" : "Expand question map");
  try{ localStorage.setItem("hf-map", open ? "1" : "0"); }catch(e){}
}
(function initMap(){
  let saved = null;
  try{ saved = localStorage.getItem("hf-map"); }catch(e){}
  setMap(saved !== "0");
})();
mapToggle.onclick = () => setMap(mapPanel.classList.contains("collapsed"));

/* ---------- options ---------- */
function renderOptions(){
  const q = DATA.questions[current];
  optsEl.innerHTML = "";
  LETTERS.forEach(l=>{
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = '<span class="key">'+l.toUpperCase()+'</span><span>'+q.opts[l]+'</span>';
    btn.onclick = () => pick(l);
    optsEl.appendChild(btn);
  });
}

function pick(l){
  if(picks[current] !== null) return;           // locked once answered
  picks[current] = l;
  render();
}

/* ---------- main render ---------- */
function render(){
  const q = DATA.questions[current];
  const picked = picks[current];
  const correct = DATA.answers[String(current+1)].toLowerCase();

  $("qCount").textContent = "Question "+(current+1)+" of "+N;
  $("qText").textContent = q.q;
  renderOptions();

  const chip = $("chip");
  if(picked === null){
    chip.className = "status-chip chip-none"; chip.textContent = "Unanswered";
  } else if(picked === correct){
    chip.className = "status-chip chip-correct"; chip.textContent = "Correct ✓";
  } else {
    chip.className = "status-chip chip-wrong"; chip.textContent = "Incorrect ✗";
  }

  const optBtns = optsEl.children;
  LETTERS.forEach((l,i)=>{
    const b = optBtns[i];
    b.classList.remove("correct","wrong","dimmed");
    if(picked === null) return;               // unanswered: plain options
    if(l === correct)       b.classList.add("correct");   // green (always when answered)
    else if(l === picked)   b.classList.add("wrong");     // red = your wrong pick
    else                    b.classList.add("dimmed");
  });

  // map
  cells.forEach((c,i)=>{
    const p = picks[i], a = DATA.answers[String(i+1)].toLowerCase();
    c.className = "cell" + (p===null ? "" : p===a ? " g" : " r") + (i===current ? " current" : "");
  });

  // progress bar (answered count)
  let answered=0; picks.forEach(p=>{ if(p!==null) answered++; });
  $("bar").style.width = (answered/N*100)+"%";

  // nav
  $("prevBtn").disabled = current === 0;
  $("nextBtn").disabled = current === N-1;
  $("qPanel").scrollIntoView({behavior:"smooth", block:"start"});
}

$("prevBtn").onclick = () => { if(current>0){ current--; render(); } };
$("nextBtn").onclick = () => { if(current<N-1){ current++; render(); } };
$("resetBtn").onclick = () => {
  if(picks.some(p=>p!==null) && !confirm("Reset the whole quiz? All answers will be cleared.")) return;
  picks = new Array(N).fill(null); current = 0; render();
};

// keyboard: arrows to navigate, a–d / 1–4 to answer
document.addEventListener("keydown", e=>{
  if(e.key === "ArrowRight") $("nextBtn").click();
  else if(e.key === "ArrowLeft") $("prevBtn").click();
  else if(picks[current]===null){
    const i = ["a","b","c","d"].indexOf(e.key.toLowerCase());
    if(i>=0) pick(LETTERS[i]);
  }
});

render();
</script>
</body>
</html>
